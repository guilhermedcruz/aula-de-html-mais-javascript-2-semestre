<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="central">
    <h1 class="texto-prateado-claro">PAINEL DIGITAL</h1>

    
    <div class="relogio">
      <span id="horas" class="texto-dourado">00</span>
      <span class="texto-dourado">:</span>
      <span id="minutos" class="texto-dourado">00</span>
      <span class="texto-dourado">:</span>
      <span id="segundos" class="texto-dourado">00</span>
    </div>

    <div>
      <span id="data" class="texto-prateado-claro">00/00/00</span>
    </div>

  
    <div class="container-datas">
      <div class="box-data">
        <h2 class="texto-prateado-claro">Dia</h2>
        <span id="Dia" class="texto-dourado">00</span>
      </div>

      <div class="box-data">
        <h2 class="texto-prateado-claro"">Mes</h2>
        <span id="Mes" class="texto-dourado">00</span>
      </div>

      <div class="box-data">
        <h2 class="texto-prateado-claro">Ano</h2>
        <span id="Ano" class="texto-dourado">00</span>
      </div>
    </div>

    <div class="box-horario">
      <span id="Horario" class="texto-dourado">Boa Tarde</span>
    </div>
    <h1 class="texto-dourado">PAINEL ATUALIZADO AUTOMATICAMENTE!</h1>
  </div>
<script src="js/script.js"></script>
</body>
</html>
